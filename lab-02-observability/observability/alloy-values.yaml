fullnameOverride: lab2-alloy

crds:
  create: false
configReloader:
  enabled: false

rbac:
  create: true
  namespaces:
    - lab2
  rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch"]
  clusterRules: []

controller:
  type: daemonset
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  volumes:
    extra:
      - name: alloy-state
        hostPath:
          path: /var/lib/lab2-alloy
          type: DirectoryOrCreate

alloy:
  enableReporting: false
  storagePath: /var/lib/alloy
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  mounts:
    varlog: true
    extra:
      - name: alloy-state
        mountPath: /var/lib/alloy
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi
  configMap:
    create: true
    content: |
      logging {
        level = "info"
        format = "logfmt"
      }

      discovery.kubernetes "api" {
        role = "pod"
        namespaces {
          names = ["lab2"]
        }
        selectors {
          role = "pod"
          label = "app.kubernetes.io/instance=lab2-api"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "api_logs" {
        targets = discovery.kubernetes.api.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action = "keep"
          regex = "api"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label = "container"
        }
        rule {
          target_label = "service"
          replacement = "lab2-api"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator = "/"
          target_label = "__path__"
          replacement = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "api_logs" {
        path_targets = discovery.relabel.api_logs.output
        sync_period = "5s"
      }

      loki.source.file "api_logs" {
        targets = local.file_match.api_logs.targets
        forward_to = [loki.process.api_logs.receiver]
      }

      loki.process "api_logs" {
        stage.cri {}
        stage.label_drop {
          values = ["filename"]
        }
        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://lab2-loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
