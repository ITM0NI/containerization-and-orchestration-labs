apiVersion: v1
kind: Pod
metadata:
  name: bad-host-path
  labels:
    app: shop
spec:
  containers:
    - name: app
      image: localhost:5000/shop-api:1.0.0
      resources:
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        privileged: false
      volumeMounts:
        - name: host
          mountPath: /host-etc
  volumes:
    - name: host
      hostPath:
        path: /etc
