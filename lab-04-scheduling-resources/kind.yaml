kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab4
nodes:
  - role: control-plane
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            system-reserved: "cpu=17,memory=12Gi"
            kube-reserved: "cpu=1,memory=1Gi"
            eviction-hard: "memory.available<256Mi,nodefs.available<1Gi"