apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-1
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /var/local/postgres-1
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-db-user
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/basic-auth
stringData:
  username: shop
  password: shop
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  instances: 1
  imageName: localhost:5000/postgresql:17
  imagePullPolicy: IfNotPresent
  enablePDB: {{ .Values.postgres.enablePDB }}
  priorityClassName: {{ .Values.postgres.priorityClassName }}
  inheritedMetadata:
    labels:
      app: postgres
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - {{ .Values.postgres.nodeName }}
  resources:
    requests:
      cpu: {{ .Values.postgres.resources.requests.cpu }}
      memory: {{ .Values.postgres.resources.requests.memory }}
    limits:
      cpu: {{ .Values.postgres.resources.limits.cpu }}
      memory: {{ .Values.postgres.resources.limits.memory }}
  storage:
    size: 1Gi
    storageClass: manual
  bootstrap:
    initdb:
      database: shop
      owner: shop
      secret:
        name: shop-db-user
  postgresql:
    pg_hba:
      - host all all all scram-sha-256
