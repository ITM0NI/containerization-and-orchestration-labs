{{- if not (regexMatch "^(0|[1-9][0-9]?|100)$" (toString .Values.traffic.v2Weight)) }}
{{- fail "traffic.v2Weight must be an integer in 0..100" }}
{{- end }}
{{- if .Values.mesh.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  {{- if .Values.mesh.retries.enabled }}
  annotations:
    retry.linkerd.io/http: "5xx"
    retry.linkerd.io/limit: "3"
  {{- end }}
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: api
      port: 8080
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: api-v1
          port: 8080
          weight: {{ sub 100 (int .Values.traffic.v2Weight) }}
        - group: ""
          kind: Service
          name: api-v2
          port: 8080
          weight: {{ int .Values.traffic.v2Weight }}
{{- end }}
